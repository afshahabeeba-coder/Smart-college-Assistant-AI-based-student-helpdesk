<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart College Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-indigo-900 via-blue-900 to-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl shadow-2xl w-full max-w-md p-8 text-white">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-full shadow-lg mb-4">
                <i class="fa-solid fa-graduation-cap text-2xl"></i>
            </div>
            <h1 class="text-3xl font-bold tracking-tight">Smart College Assistant</h1>
            <p class="text-blue-200 text-sm mt-1">AI-Based Student Helpdesk Portal</p>
        </div>

        {% if error %}
        <div class="bg-red-500/20 border border-red-500 text-red-200 px-4 py-3 rounded-lg mb-6 text-sm flex items-center gap-2">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form action="{{ url_for('login') }}" method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-blue-100 mb-2">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-blue-300">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" name="username" required class="w-full pl-10 pr-4 py-3 bg-white/5 border border-white/20 rounded-xl text-white placeholder-blue-300/50 focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="Enter username (student / admin)">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-blue-100 mb-2">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-blue-300">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" name="password" required class="w-full pl-10 pr-4 py-3 bg-white/5 border border-white/20 rounded-xl text-white placeholder-blue-300/50 focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="Enter password">
                </div>
            </div>

            <button type="submit" class="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 rounded-xl font-semibold shadow-lg transition duration-200">
                Sign In
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-white/10 text-center text-xs text-blue-200">
            <p class="mb-4">Don't have an account? <a href="{{ url_for('register') }}" class="text-blue-400 font-semibold hover:underline">Register as a New Student</a></p>
        </div>

        <div class="pt-2 border-t border-white/10 text-center text-xs text-blue-200/70">
            <p class="font-semibold mb-2">Quick Demo Accounts:</p>
            <div class="flex justify-center gap-4">
                <span class="bg-blue-900/50 px-3 py-1 rounded border border-blue-500/30">Student: <b>student</b> / <b>student123</b></span>
                <span class="bg-indigo-900/50 px-3 py-1 rounded border border-indigo-500/30">Admin: <b>admin</b> / <b>admin123</b></span>
            </div>
        </div>
    </div>
</body>
</html>
